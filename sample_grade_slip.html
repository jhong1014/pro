<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성적 확인표 예시</title>
<style>
@page { size: A4 portrait; margin: 10mm; }
body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; margin: 0; color: #000; background: #fff; }
.page-note { font-size: 12px; color: #555; margin: 8px 0 12px; }
@media print { .page-note { display: none; } }
.slip { border: 1.5px solid #000; padding: 8px 10px 10px; margin-bottom: 0; break-inside: avoid; page-break-inside: avoid; }
.cut { border-top: 1px dashed #888; margin: 7mm 0; position: relative; height: 0; }
.cut span { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); background: #fff; padding: 0 6px; font-size: 10px; color: #888; }
.head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6px; }
.head h1 { font-size: 15px; margin: 0; }
.head .who { font-size: 14px; font-weight: 700; }
.head .who small { font-weight: 400; font-size: 11px; color: #444; margin-left: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { border: 1px solid #333; padding: 3px 6px; }
th { background: #eef2f6; font-weight: 700; }
td.n, th.n { text-align: center; width: 52px; white-space: nowrap; }
td.task { font-weight: 700; width: 120px; background: #fafafa; }
td.sub { text-align: center; font-weight: 700; width: 70px; }
td.sub small { display: block; font-weight: 400; font-size: 10px; color: #444; }
.miss { color: #b00; }
.total { display: flex; gap: 10px; margin-top: 6px; align-items: stretch; }
.total .box { flex: 1; border: 1.5px solid #000; display: flex; align-items: center; justify-content: space-between; padding: 4px 10px; }
.total .box b { font-size: 18px; }
.total .box .lbl { font-size: 12px; }
.total .sign { flex: 1; border: 1.5px solid #000; padding: 4px 10px; font-size: 11px; display: flex; align-items: center; justify-content: space-between; }
.foot { font-size: 10px; color: #444; margin-top: 4px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="page-note">※ 예시 데이터입니다. 인쇄 미리보기(Ctrl+P)로 보면 A4 한 장에 2~3명이 자동으로 배치됩니다.</div>
<div id="out"></div>
<script>
// ---- 예시 데이터 (실제로는 ev.tasks / ev.scoreRows 사용) ----
const tasks = [
  { title: '논설문 쓰기', items: [['주장의 타당성', 40], ['근거의 적절성', 30], ['글의 짜임', 20], ['표현과 맞춤법', 10]] },
  { title: '토론 활동', items: [['논리적 말하기', 40], ['반론과 대응', 30], ['경청과 태도', 30]] },
  { title: '독서 포트폴리오', items: [['독서 기록의 충실성', 50], ['감상의 깊이', 30], ['자기 성찰', 20]] }
];
const students = [
  { cls: '1-3', no: 1, name: '김하늘', s: [[36, 27, 18, 8], [32, 24, 30], [45, 24, 16]] },
  { cls: '1-3', no: 2, name: '이도윤', s: [[40, 30, 16, 10], [36, 30, 24], [50, 30, null]] },
  { cls: '1-3', no: 3, name: '박서연', s: [[28, 21, 14, 6], [24, 18, 24], [35, 18, 12]] },
  { cls: '1-3', no: 4, name: '최지우', s: [[32, 24, 20, 8], [40, 24, 30], [45, 30, 20]] }
];
const school = 'OO중학교', term = '2026학년도 2학기', printed = '2026-11-18 14:20';
const F = v => String(Math.round(v * 10) / 10);

const maxAll = tasks.reduce((a, t) => a + t.items.reduce((b, i) => b + i[1], 0), 0);
document.getElementById('out').innerHTML = students.map((st, k) => {
  let sumAll = 0, missing = false;
  const rows = tasks.map((t, ti) => {
    const max = t.items.reduce((b, i) => b + i[1], 0);
    let sub = 0, miss = false;
    const trs = t.items.map((it, ii) => {
      const v = st.s[ti][ii];
      if (v == null) miss = true; else sub += v;
      return '<tr>' + (ii === 0 ? '<td class="task" rowspan="' + t.items.length + '">' + t.title + '</td>' : '') +
        '<td>' + it[0] + '</td><td class="n">' + it[1] + '</td>' +
        '<td class="n">' + (v == null ? '<span class="miss">채점 전</span>' : v) + '</td>' +
        (ii === 0 ? '<td class="sub" rowspan="' + t.items.length + '">' + F(sub) + '<small>/ ' + max + '</small></td>' : '') + '</tr>';
    }).join('');
    sumAll += sub; missing = missing || miss;
    return trs;
  }).join('');
  const conv300 = maxAll ? sumAll / maxAll * 300 : 0;
  return (k ? '<div class="cut"><span>✂ 자르는 선</span></div>' : '') +
    '<div class="slip"><div class="head"><h1>' + term + ' 수행평가 성적 확인표</h1>' +
    '<div class="who">' + school + ' ' + st.cls + ' ' + st.no + '번 ' + st.name + '<small>출력 ' + printed + '</small></div></div>' +
    '<table><thead><tr><th>과제</th><th>평가 영역</th><th class="n">배점</th><th class="n">점수</th><th class="n">과제 합계</th></tr></thead><tbody>' +
    rows + '</tbody></table>' +
    '<div class="total"><div class="box"><span class="lbl">총점 (300점 만점)</span><b>' + F(conv300) + ' <small style="font-size:12px;font-weight:400">/ 300</small></b></div>' +
    '<div class="sign"><span>위 성적을 확인했습니다.</span><span>학생 서명 ____________</span></div></div>' +
    '<div class="foot"><span>' + (missing ? '※ 채점 전 항목은 0점으로 계산되어 있습니다.' : '') + '</span>' +
    '<span>성적에 이의가 있으면 ____월 ____일까지 담당 선생님께 말씀하세요.</span></div></div>';
}).join('');
</script>
</body>
</html>
