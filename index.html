<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>수업 진도 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
--card:#ffffff;
--fg:#0f172a; --muted:#64748b;
--border:#e2e8f0; --border-strong:#cbd5e1;
--primary:#4f46e5; --primary-2:#7c3aed;
--primary-soft:#eef2ff;
--danger:#e11d48;
--ok:#059669;
--warn:#d97706;
--shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.06);
--radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
color:var(--fg);
background:
radial-gradient(1200px 500px at -10% -10%, #dbeafe 0%, transparent 60%),
radial-gradient(1000px 500px at 110% 0%, #ede9fe 0%, transparent 55%),
radial-gradient(900px 500px at 50% 110%, #fae8ff 0%, transparent 55%),
#f8fafc;
min-height:100vh;
padding: 16px;
}
.wrap{max-width:1180px; margin:0 auto;}
.hero{
background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #db2777 100%);
color:#fff;
border-radius:18px;
padding:20px 22px;
box-shadow: var(--shadow);
display:flex; align-items:center; justify-content:space-between; gap:12px;
flex-wrap:wrap;
}
.hero h1{margin:0; font-size:22px; letter-spacing:-.3px}
.hero .sub{opacity:.9; font-size:13px; margin-top:2px}
.hero .badges{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.hero .today-badge, .hero .dday-badge{
background:rgba(255,255,255,.18);
padding:7px 13px; border-radius:999px; font-weight:600; font-size:13px;
border:1px solid rgba(255,255,255,.25);
white-space:nowrap;
}
.hero .dday-badge b{font-size:15px; margin-left:4px}
.tabs{
display:flex; gap:6px; margin:14px 0 12px;
background:#fff; padding:6px; border-radius:14px; border:1px solid var(--border);
box-shadow: var(--shadow);
overflow:auto;
}
.tab{
flex:1; min-width:78px; text-align:center; padding:9px 10px; cursor:pointer;
border-radius:10px; font-weight:600; color:#475569; font-size:14px;
white-space:nowrap;
transition: all .15s ease;
}
.tab:hover{background:#f1f5f9}
.tab.active{
background: linear-gradient(135deg,#4f46e5,#7c3aed);
color:#fff; box-shadow: 0 6px 14px rgba(79,70,229,.25);
}
.card{
background:var(--card);
border:1px solid var(--border);
border-radius:var(--radius);
padding:16px;
box-shadow: var(--shadow);
margin-bottom:14px;
}
.card h2{margin:0 0 10px; font-size:16px}
.card h3{margin:12px 0 8px; font-size:14px; color:var(--muted)}
/* 툴바 : 좌우 화살표 + 가운데 날짜만 */
.toolbar{
display:flex; align-items:center; justify-content:center;
}
.nav{display:flex; align-items:center; gap:6px; flex-wrap:nowrap;}
.nav button{
width:36px; height:36px; border-radius:10px; border:1px solid var(--border);
background:#fff; cursor:pointer; font-weight:700; color:#334155; font-size:15px;
transition:.15s; flex-shrink:0;
}
.nav button:hover{background:#f1f5f9; border-color:var(--border-strong)}
.center-title{
font-size:17px; font-weight:700; padding:0 10px;
min-width:140px; text-align:center;
}
input[type=date], input[type=text], input[type=number], input[type=email], input[type=password], select, textarea{
border:1px solid var(--border); background:#fff; border-radius:10px;
padding:8px 10px; font-size:14px; color:var(--fg); outline:none;
transition:.15s;
font-family:inherit;
}
input:focus, select:focus, textarea:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.15) }
.btn{
display:inline-flex; align-items:center; gap:6px;
border:none; cursor:pointer; padding:9px 14px; border-radius:10px;
font-weight:600; font-size:14px;
background: linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff;
box-shadow: 0 4px 10px rgba(79,70,229,.22);
transition:.15s;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 14px rgba(79,70,229,.32)}
.btn.ghost{ background:#fff; color:#334155; border:1px solid var(--border); box-shadow:none; }
.btn.ghost:hover{background:#f8fafc}
.btn.danger{background:linear-gradient(135deg,#ef4444,#db2777); box-shadow:0 4px 10px rgba(239,68,68,.22)}
.btn.ok{background:linear-gradient(135deg,#10b981,#059669); box-shadow:0 4px 10px rgba(16,185,129,.22)}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#d97706); box-shadow:0 4px 10px rgba(217,119,6,.22)}
.btn.sm{padding:6px 10px; font-size:12px}
table{width:100%; border-collapse:separate; border-spacing:0; overflow:hidden;
border:1px solid var(--border); border-radius:12px; background:#fff;}
thead th{
background:#f8fafc; color:#334155; font-weight:700; font-size:13px;
padding:10px 12px; text-align:left; border-bottom:1px solid var(--border);
}
tbody td{padding:10px 12px; border-bottom:1px solid #f1f5f9; font-size:14px; vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbff}
.school-chip{
display:inline-block; padding:4px 10px; border-radius:999px; font-weight:700; font-size:12px;
border:1px solid transparent;
}
.num{ text-align:right; font-variant-numeric: tabular-nums }
.empty{
padding:28px 14px; text-align:center; color:var(--muted);
background:#fff; border:1px dashed var(--border-strong); border-radius:12px;
}
.empty .big{font-size:18px; margin-bottom:6px; color:#334155; font-weight:700}
.flex{display:flex; gap:10px; flex-wrap:wrap}
.row{display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:10px}
label.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted)}
label.field > input, label.field > select, label.field > textarea{font-size:14px; color:var(--fg)}
/* Calendar */
.cal{ display:grid; grid-template-columns: repeat(7, 1fr); gap:5px; }
.cal .dow{
text-align:center; font-weight:700; padding:7px 0; font-size:12px;
background:#f1f5f9; border-radius:8px; color:#475569;
}
.cal .dow.sun{color:#dc2626}
.cal .dow.sat{color:#2563eb}
.cell{
min-height:80px; background:#fff; border:1px solid var(--border);
border-radius:10px; padding:5px; position:relative; cursor:pointer;
transition:.15s;
}
.cell:hover{border-color:var(--primary); box-shadow:0 3px 10px rgba(79,70,229,.12)}
.cell.out{background:#f8fafc; color:#cbd5e1}
.cell.today{border:2px solid var(--primary); box-shadow:0 3px 12px rgba(79,70,229,.15)}
.cell.holiday{background:#fff1f2; border-color:#fecdd3}
.cell .d{font-weight:700; font-size:13px}
.cell .d.sun{color:#dc2626}
.cell .d.sat{color:#2563eb}
.cell .cnt{
position:absolute; top:5px; right:5px; background:#0f172a; color:#fff;
font-size:11px; padding:1px 7px; border-radius:999px; font-weight:700;
}
.cell .hol-tag{
position:absolute; top:5px; right:5px; background:#be123c; color:#fff;
font-size:10px; padding:1px 6px; border-radius:999px; font-weight:700;
}
.cell .chips{display:flex; flex-wrap:wrap; gap:3px; margin-top:6px}
.cell .chips .school-chip{font-size:10px; padding:2px 6px}
.cell .more{font-size:11px; color:var(--muted); padding:2px 4px}
/* Grid (day/week 공용) */
.week-grid{
display:grid; gap:5px;
background:#fff; border:1px solid var(--border); border-radius:12px;
padding:6px;
}
.week-grid.week{ grid-template-columns: 56px repeat(5, 1fr); }
.week-grid.day { grid-template-columns: 56px 1fr; }
.wg-head{
padding:7px 4px; text-align:center; border-radius:8px; background:#f1f5f9;
font-weight:700; font-size:13px; color:#334155;
}
.wg-head.today{background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe}
.wg-head.holiday{background:#fff1f2; color:#be123c; border:1px solid #fecdd3}
.wg-head .wg-dow{font-size:13px}
.wg-head .wg-date{font-size:11px; opacity:.9; margin-top:2px}
.wg-corner{background:#0f172a; color:#fff; border-radius:8px; padding:7px 4px; text-align:center; font-weight:700; font-size:11px}
.wg-period{
background:#f8fafc; border:1px solid var(--border); border-radius:8px;
padding:7px 4px; text-align:center; font-weight:700; font-size:12px; color:#475569;
}
.wg-cell{
min-height:64px; background:#fff; border:1px solid var(--border);
border-radius:8px; padding:3px; display:flex; flex-direction:column; gap:3px;
}
.wg-cell.hol{ background:#fff1f2; border-color:#fecdd3; align-items:center; justify-content:center;
color:#9f1239; font-weight:700; font-size:12px; }
.wg-item{
border:1px solid transparent;
border-radius:6px; padding:4px 6px; font-size:12px; cursor:pointer; line-height:1.3;
display:flex; flex-direction:column; gap:2px;
transition:.12s;
}
.wg-item:hover{ filter:brightness(0.96); transform:translateY(-1px) }
.wg-item .wg-cls{font-weight:700}
.wg-item .wg-school{font-size:11px; opacity:.85}
/* Todo List */
.todo-card{background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:14px}
.todo-card h3{margin:0 0 10px; font-size:15px; display:flex; align-items:center; gap:8px}
.todo-card h3 .badge{background:#eef2ff; color:#4338ca; padding:2px 8px; border-radius:999px; font-size:11px}
.todo-input{display:flex; gap:6px; margin-bottom:10px}
.todo-input input{flex:1}
.todo-list{display:flex; flex-direction:column; gap:6px}
.todo-item{
display:flex; align-items:center; gap:8px;
padding:8px 10px; border:1px solid var(--border); border-radius:10px;
background:#fafbff;
}
.todo-item input[type=checkbox]{ width:18px; height:18px; cursor:pointer; flex-shrink:0 }
.todo-item .todo-text{flex:1; font-size:14px; line-height:1.4; word-break:break-all}
.todo-item .todo-time{font-size:11px; color:var(--muted); flex-shrink:0; white-space:nowrap}
.todo-item .todo-del{
background:transparent; border:none; color:#94a3b8; cursor:pointer;
font-size:16px; padding:2px 6px; border-radius:6px;
}
.todo-item .todo-del:hover{background:#fee2e2; color:#dc2626}
/* Timetable builder */
.tt-items{border:1px dashed var(--border-strong); border-radius:12px; padding:10px; background:#fafbff}
.tt-item{
display:grid; grid-template-columns: 100px 90px 110px 1fr 40px; gap:8px; align-items:end;
padding:8px; background:#fff; border:1px solid var(--border);
border-radius:10px; margin-bottom:6px;
}
.tt-item:last-child{margin-bottom:0}
.icon-btn{
width:36px; height:36px; border-radius:10px; border:1px solid var(--border);
background:#fff; cursor:pointer; font-weight:700; color:#64748b;
}
.icon-btn:hover{background:#fef2f2; color:#dc2626; border-color:#fecaca}
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:12px}
.kpi{background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
.kpi .label{font-size:12px; color:var(--muted)}
.kpi .value{font-size:22px; font-weight:800; margin-top:2px}
.kpi.p{background:linear-gradient(135deg,#eef2ff,#faf5ff); border-color:#e0e7ff}
.kpi.o{background:linear-gradient(135deg,#ecfdf5,#f0fdfa); border-color:#bbf7d0}
.kpi.w{background:linear-gradient(135deg,#fffbeb,#fef2f2); border-color:#fde68a}
.toast{
position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
background:#0f172a; color:#fff; padding:10px 16px; border-radius:12px;
font-size:14px; opacity:0; transition:.25s; pointer-events:none; z-index:9999;
box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
.toast.show{opacity:1; bottom:30px}
.toast.err{background:#b91c1c}
.toast.ok{background:#047857}
.modal-back{
position:fixed; inset:0; background:rgba(15,23,42,.45); display:none;
align-items:center; justify-content:center; z-index:9000; padding:16px;
}
.modal-back.show{display:flex}
.modal{
background:#fff; border-radius:16px; width:100%; max-width:520px;
padding:20px; box-shadow: 0 24px 60px rgba(0,0,0,.25);
max-height:90vh; overflow:auto;
}
.modal h3{margin:0 0 10px; font-size:16px}
.modal .meta{color:var(--muted); font-size:12px; margin-bottom:10px}
.modal .prog-text{
background:#f8fafc; border:1px solid var(--border); border-radius:10px;
padding:12px; white-space:pre-wrap; font-size:14px; line-height:1.55;
min-height:80px;
}
.modal .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap}
.hint{font-size:12px; color:var(--muted); margin-top:4px}
.muted{color:var(--muted)}
.badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:#eef2ff; color:#4338ca}
.badge.warn{background:#fef3c7; color:#92400e}
.badge.danger{background:#ffe4e6; color:#9f1239}
/* [신규] 로딩 스켈레톤 */
.skeleton{
padding:28px 14px; text-align:center; color:var(--muted);
background:#fff; border:1px solid var(--border); border-radius:12px;
}
.spinner{
width:22px; height:22px; border:3px solid #e2e8f0; border-top-color:var(--primary);
border-radius:50%; display:inline-block; animation:spin .8s linear infinite; vertical-align:middle;
margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* 로그인 화면 */
.login-back{
position:fixed; inset:0; z-index:9500; display:flex; align-items:center; justify-content:center; padding:16px;
background:
radial-gradient(1200px 500px at -10% -10%, #dbeafe 0%, transparent 60%),
radial-gradient(1000px 500px at 110% 0%, #ede9fe 0%, transparent 55%),
#f8fafc;
}
.login-back.hidden{display:none}
.login-card{
width:100%; max-width:360px; background:#fff; border:1px solid var(--border);
border-radius:18px; padding:24px; box-shadow:0 24px 60px rgba(15,23,42,.12);
display:flex; flex-direction:column; gap:12px;
}
.login-card h2{margin:0; font-size:20px}
.login-card .btn{justify-content:center; margin-top:4px}
.login-err{color:var(--danger); font-size:13px; min-height:18px}
.logout-btn{
background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.25);
padding:7px 13px; border-radius:999px; font-weight:600; font-size:13px; cursor:pointer; font-family:inherit;
}
.logout-btn:hover{background:rgba(255,255,255,.28)}
/* 모바일 반응형 */
@media (max-width: 780px){
body{padding:12px}
.hero{padding:16px}
.hero h1{font-size:19px}
.tab{min-width:64px; font-size:13px; padding:8px 6px}
.tt-item{grid-template-columns:1fr 1fr 1fr 1fr 40px}
}
@media (max-width: 560px){
.hero{flex-direction:column; align-items:flex-start}
.center-title{font-size:15px; min-width:100px; padding:0 4px}
.nav button{width:32px; height:32px; font-size:14px}
.week-grid.week{ grid-template-columns: 40px repeat(5, 1fr); gap:3px; padding:4px; }
.week-grid.day { grid-template-columns: 44px 1fr; gap:4px; padding:5px; }
.wg-head{padding:5px 2px; font-size:12px}
.wg-head .wg-dow{font-size:12px}
.wg-head .wg-date{font-size:10px}
.wg-corner{font-size:10px; padding:5px 2px}
.wg-period{font-size:11px; padding:5px 2px}
.wg-cell{min-height:52px; padding:2px}
.wg-item{padding:3px 4px; font-size:11px}
.wg-item .wg-school{font-size:10px}
.cell{min-height:64px}
.cal .dow{font-size:11px; padding:5px 0}
.card{padding:12px}
.todo-item .todo-time{display:none}
}
</style>
</head>
<body>
<!-- 로그인 화면 -->
<div class="login-back" id="loginBack">
<form class="login-card" onsubmit="doLogin(event)">
<h2>정보 수업 진도</h2>
<div class="muted" style="font-size:13px">선생님 계정으로 로그인하세요</div>
<label class="field">이메일<input type="email" id="loginEmail" autocomplete="username" required/></label>
<label class="field">비밀번호<input type="password" id="loginPw" autocomplete="current-password" required/></label>
<button class="btn" type="submit" id="loginBtn">로그인</button>
<div class="login-err" id="loginErr"></div>
</form>
</div>
<div class="wrap">
<div class="hero">
<div>
<h1>정보 수업 진도</h1>
<div class="sub"></div>
</div>
<div class="badges">
<div class="today-badge" id="todayBadge">오늘: -</div>
<div class="dday-badge" id="ddayBadge">-</div>
<button class="logout-btn" id="logoutBtn" style="display:none" onclick="doLogout()">로그아웃</button>
</div>
</div>
<div class="tabs">
<div class="tab active" data-view="day">일</div>
<div class="tab" data-view="week">주</div>
<div class="tab" data-view="cal">캘린더</div>
<div class="tab" data-view="tt">기초 시간표</div>
<div class="tab" data-view="stat">수업시수</div>
<div class="tab" data-view="add">자료 입력</div>
<div class="tab" data-view="hol">공휴일</div>
</div>
<!-- 조회 공통 툴바 (좌우 화살표 + 날짜만) -->
<div id="viewerCard" class="card">
<div class="toolbar">
<div class="nav">
<button title="이전(큰)" onclick="moveDate('big',-1)">«</button>
<button title="이전" onclick="moveDate('small',-1)">‹</button>
<div class="center-title" id="centerTitle">-</div>
<button title="다음" onclick="moveDate('small',1)">›</button>
<button title="다음(큰)" onclick="moveDate('big',1)">»</button>
</div>
</div>
<div id="viewerBody" style="margin-top:12px"></div>
<div id="todoCard" class="todo-card" style="display:none">
<h3>오늘의 할 일 <span class="badge" id="todoCount">0</span></h3>
<div class="todo-input">
<input type="text" id="todoText" placeholder="지금 하고 있는 할 일을 입력하세요" onkeydown="if(event.key==='Enter')submitTodo()"/>
<button class="btn" onclick="submitTodo()">확인</button>
</div>
<div class="todo-list" id="todoList"></div>
</div>
</div>
<!-- 기초 시간표 생성 -->
<div id="ttCard" class="card" style="display:none">
<h2>기초 시간표 일괄 생성</h2>
<div class="row">
<label class="field">학교명<input type="text" id="ttSchool" list="schoolList" placeholder="예: 서울초"/></label>
<label class="field">시작일<input type="date" id="ttStart"/></label>
<label class="field">종료일<input type="date" id="ttEnd"/></label>
<label class="field">중복 처리
<select id="ttOverwrite">
<option value="skip">중복 건너뛰기</option>
<option value="force">중복 상관없이 추가</option>
</select>
</label>
<label class="field">공휴일/방학
<select id="ttSkipHol">
<option value="yes" selected>휴일 자동 제외</option>
<option value="no">휴일도 생성</option>
</select>
</label>
</div>
<h3>요일별 시간표</h3>
<div class="tt-items" id="ttItems"></div>
<div style="margin-top:8px" class="flex">
<button class="btn ghost" onclick="addTtItem()">＋ 요일 시간 추가</button>
<button class="btn" onclick="generateTt()">일정 생성</button>
</div>
<div class="hint">공휴일/방학 제외를 켜면 [공휴일] 탭에 등록된 기간이 자동 건너뜁니다.</div>
</div>
<!-- 수업시수 집계 -->
<div id="statCard" class="card" style="display:none">
<h2>기간별 수업시수 집계</h2>
<div class="row">
<label class="field">시작일<input type="date" id="statStart"/></label>
<label class="field">종료일<input type="date" id="statEnd"/></label>
<label class="field">학교(선택)<select id="statSchool"><option value="">전체</option></select></label>
<label class="field">집계 기준
<select id="statGroup">
<option value="school">학교별</option>
<option value="school-class">학교 · 반별</option>
<option value="school-day">학교 · 요일별</option>
</select>
</label>
</div>
<div style="margin-top:10px"><button class="btn" onclick="runStats()">집계 조회</button></div>
<div id="statBody" style="margin-top:14px"></div>
</div>

<script>
/* =========================================================
   Supabase 연결 설정
   - 공개용(publishable) 키는 웹페이지에 넣어도 되는 키입니다.
   - 데이터 보호는 Supabase의 RLS(허용된 이메일만 접근)로 이뤄집니다.
   - service_role 키는 절대 여기에 넣지 마세요.
========================================================= */
const SUPABASE_URL = 'https://pfasdccrftfedsvwwalb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XuCCXqn_RAYYbEG9Ua33XA_-opIYotq';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- 공통 도우미 ---------- */
function must(res){
  if (res.error) throw new Error(res.error.message);
  return res.data;
}
// 한국 시간 기준 오늘 (yyyy-MM-dd)
function seoulToday(){
  return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul' }).format(new Date());
}
// 한국 시간 기준 'yyyy-MM-dd HH:mm'
function seoulDateTime(iso){
  if (!iso) return '';
  return new Intl.DateTimeFormat('sv-SE', {
    timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit'
  }).format(new Date(iso));
}
// DB 행 → 화면에서 쓰던 형태 (row 자리에 DB id 사용)
function toRec(r){
  return {
    row: r.id,
    date: r.date,
    school: r.school || '',
    period: r.period || '',
    cls: r.class_name || '',
    progress: r.progress || ''
  };
}
function byPeriod(a, b){
  const pa = parseInt(a.period, 10), pb = parseInt(b.period, 10);
  if (!isNaN(pa) && !isNaN(pb) && pa !== pb) return pa - pb;
  return String(a.period).localeCompare(String(b.period));
}
// 1000행 제한을 넘는 조회를 위해 나눠서 모두 가져오기
async function fetchAll(makeQuery){
  const out = [], size = 1000;
  for (let from = 0; ; from += size){
    const data = must(await makeQuery().range(from, from + size - 1));
    out.push.apply(out, data);
    if (data.length < size) break;
  }
  return out;
}

/* ---------- 학교 목록 (메모리 캐시, 쓰기 시 무효화) ---------- */
let _schools = null;
async function loadSchoolList(){
  if (_schools) return _schools;
  const rows = await fetchAll(function(){ return sb.from('records').select('school').order('id'); });
  const set = {};
  rows.forEach(function(r){ if (r.school) set[r.school] = true; });
  _schools = Object.keys(set).sort();
  return _schools;
}
function invalidateSchools(){ _schools = null; }

/* ---------- 휴일 ---------- */
async function loadHolidayList(){
  const data = must(await sb.from('holidays').select('*').order('start_date'));
  return data.map(function(h){
    return { row: h.id, start: h.start_date, end: h.end_date || h.start_date, reason: h.reason || '' };
  });
}
function findHoliday(dateStr, list){
  for (let i = 0; i < list.length; i++){
    if (dateStr >= list[i].start && dateStr <= list[i].end) return list[i];
  }
  return null;
}

/* =========================================================
   API : 예전 Code.gs 함수들을 같은 이름·같은 결과 형태로 구현
========================================================= */
const API = {
  async getInitialData(){
    const today = seoulToday();
    const results = await Promise.all([ API.getRecords(today, ''), API.getTodos(), loadSchoolList() ]);
    return { today: today, schools: results[2], day: results[0], todos: results[1] };
  },

  async getSchools(){
    invalidateSchools();
    return loadSchoolList();
  },

  async getRecords(dateStr, school){
    let q = sb.from('records').select('*').eq('date', dateStr);
    if (school) q = q.eq('school', school);
    const results = await Promise.all([ q.then(must), loadHolidayList(), loadSchoolList() ]);
    const list = results[0].map(toRec).sort(byPeriod);
    return { date: dateStr, records: list, schools: results[2], holiday: findHoliday(dateStr, results[1]) };
  },

  async getRecordsRange(s, e, school){
    const results = await Promise.all([
      fetchAll(function(){
        let q = sb.from('records').select('*').gte('date', s).lte('date', e).order('date').order('id');
        if (school) q = q.eq('school', school);
        return q;
      }),
      loadHolidayList(),
      loadSchoolList()
    ]);
    const list = results[0].map(toRec).sort(function(a, b){
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      const pa = parseInt(a.period, 10), pb = parseInt(b.period, 10);
      if (!isNaN(pa) && !isNaN(pb) && pa !== pb) return pa - pb;
      return 0;
    });
    return { start: s, end: e, records: list, schools: results[2], holidays: results[1] };
  },

  async getMonthSummary(year, month, school){
    const start = year + '-' + ('0' + month).slice(-2) + '-01';
    const end = fmt(new Date(year, month, 0));
    const results = await Promise.all([
      fetchAll(function(){
        let q = sb.from('records').select('date,school').gte('date', start).lte('date', end).order('id');
        if (school) q = q.eq('school', school);
        return q;
      }),
      loadHolidayList(),
      loadSchoolList()
    ]);
    const summary = {};
    results[0].forEach(function(r){
      if (!summary[r.date]) summary[r.date] = { count: 0, schools: [] };
      summary[r.date].count++;
      if (summary[r.date].schools.indexOf(r.school) < 0) summary[r.date].schools.push(r.school);
    });
    return { year: year, month: month, summary: summary, schools: results[2], holidays: results[1] };
  },

  async addRecord(rec){
    if (!rec.date) throw new Error('날짜가 올바르지 않습니다.');
    if (!rec.school) throw new Error('학교명을 입력하세요.');
    must(await sb.from('records').insert({
      date: rec.date, school: rec.school,
      period: rec.period || null, class_name: rec.cls || null, progress: rec.progress || null
    }));
    invalidateSchools();
    return API.getRecords(rec.date, '');
  },

  async updateRecord(id, rec){
    if (!rec.date) throw new Error('날짜가 올바르지 않습니다.');
    if (!rec.school) throw new Error('학교명을 입력하세요.');
    must(await sb.from('records').update({
      date: rec.date, school: rec.school,
      period: rec.period || null, class_name: rec.cls || null, progress: rec.progress || null
    }).eq('id', id));
    invalidateSchools();
    return API.getRecords(rec.date, '');
  },

  async deleteRecord(id){
    must(await sb.from('records').delete().eq('id', id));
    invalidateSchools();
    return true;
  },

  async getHolidays(){
    return loadHolidayList();
  },

  async addHoliday(h){
    if (!h || !h.start) throw new Error('시작일을 입력하세요.');
    const end = h.end || h.start;
    if (end < h.start) throw new Error('종료일이 시작일보다 앞섭니다.');
    must(await sb.from('holidays').insert({ start_date: h.start, end_date: end, reason: h.reason || '' }));
    return loadHolidayList();
  },

  async deleteHoliday(id){
    must(await sb.from('holidays').delete().eq('id', id));
    return loadHolidayList();
  },

  /* 기초 시간표 일괄 생성 (공휴일 자동 제외) */
  async generateTimetable(spec){
    if (!spec || !spec.school) throw new Error('학교명을 입력하세요.');
    if (!spec.start || !spec.end) throw new Error('기간을 입력하세요.');
    if (!spec.items || !spec.items.length) throw new Error('요일별 시간표를 최소 1개 입력하세요.');
    if (spec.start > spec.end) throw new Error('시작일이 종료일보다 늦습니다.');

    const holidays = await loadHolidayList();
    const skipHol = spec.skipHolidays !== false;

    const existing = {};
    if (!spec.overwrite){
      const rows = await fetchAll(function(){
        return sb.from('records').select('date,period,class_name')
          .eq('school', spec.school).gte('date', spec.start).lte('date', spec.end).order('id');
      });
      rows.forEach(function(r){ existing[r.date + '|' + (r.period || '') + '|' + (r.class_name || '')] = true; });
    }

    const toInsert = [];
    let skippedHoliday = 0;
    const cur = parseD(spec.start), last = parseD(spec.end);
    while (cur <= last){
      const dow = cur.getDay();
      const dateStr = fmt(cur);
      const isHol = skipHol && findHoliday(dateStr, holidays);
      spec.items.forEach(function(it){
        if (Number(it.dow) !== dow) return;
        if (isHol){ skippedHoliday++; return; }
        const key = dateStr + '|' + (it.period || '') + '|' + (it.cls || '');
        if (existing[key]) return;
        toInsert.push({
          date: dateStr, school: spec.school,
          period: it.period || null, class_name: it.cls || null, progress: it.progress || null
        });
        existing[key] = true;
      });
      cur.setDate(cur.getDate() + 1);
    }

    if (!toInsert.length){
      return { inserted: 0, skippedHoliday: skippedHoliday,
        message: '생성된 일정이 없습니다.' + (skippedHoliday ? ' (휴일 ' + skippedHoliday + '건 제외)' : '') };
    }
    for (let i = 0; i < toInsert.length; i += 500){
      must(await sb.from('records').insert(toInsert.slice(i, i + 500)));  // 한 번에 묶어서 저장
    }
    invalidateSchools();
    return { inserted: toInsert.length, skippedHoliday: skippedHoliday,
      message: toInsert.length + '건 생성' + (skippedHoliday ? ' · 휴일 ' + skippedHoliday + '건 제외' : '') };
  },

  /* 수업시수 집계 */
  async getClassStats(c){
    if (!c.start || !c.end) throw new Error('기간을 입력하세요.');
    const results = await Promise.all([
      fetchAll(function(){
        let q = sb.from('records').select('date,school,class_name').gte('date', c.start).lte('date', c.end).order('id');
        if (c.school) q = q.eq('school', c.school);
        return q;
      }),
      loadSchoolList()
    ]);
    const groupBy = c.groupBy || 'school';
    const dowLabels = ['일','월','화','수','목','금','토'];
    const groups = {};
    results[0].forEach(function(r){
      const cls = r.class_name || '';
      let key, extra;
      if (groupBy === 'school-class'){
        key = r.school + ' | ' + (cls || '(반없음)'); extra = { school: r.school, cls: cls };
      } else if (groupBy === 'school-day'){
        const dl = dowLabels[parseD(r.date).getDay()];
        key = r.school + ' | ' + dl + '요일'; extra = { school: r.school, day: dl };
      } else {
        key = r.school; extra = { school: r.school };
      }
      if (!groups[key]) groups[key] = Object.assign({ key: key, count: 0 }, extra);
      groups[key].count++;
    });
    const arr = Object.keys(groups).map(function(k){ return groups[k]; });
    arr.sort(function(a, b){
      if (a.school !== b.school) return a.school.localeCompare(b.school);
      return b.count - a.count;
    });
    return { start: c.start, end: c.end, total: results[0].length, groups: arr, schools: results[1] };
  },

  /* Todo (진행 중인 것만) */
  async getTodos(){
    const data = must(await sb.from('todos').select('*').eq('done', false).order('created_at'));
    return data.map(function(t){ return { row: t.id, text: t.content, createdAt: seoulDateTime(t.created_at) }; });
  },
  async addTodo(text){
    const t = String(text || '').trim();
    if (!t) throw new Error('할 일 내용을 입력하세요.');
    must(await sb.from('todos').insert({ content: t }));
    return API.getTodos();
  },
  async completeTodo(id){
    must(await sb.from('todos').update({ done: true }).eq('id', id));
    return API.getTodos();
  },
  async deleteTodo(id){
    must(await sb.from('todos').delete().eq('id', id));
    return API.getTodos();
  }
};

/* =========================================================
   google.script.run 호환 연결부
   - 아래 화면 코드는 예전처럼 google.script.run.xxx()를 부르지만
     실제로는 위 API(Supabase)가 실행됩니다.
========================================================= */
function makeRunner(){
  let onOk = null, onFail = null;
  const runner = new Proxy({}, {
    get: function(_, name){
      if (name === 'withSuccessHandler') return function(f){ onOk = f; return runner; };
      if (name === 'withFailureHandler') return function(f){ onFail = f; return runner; };
      return function(){
        const args = arguments;
        Promise.resolve()
          .then(function(){
            if (!API[name]) throw new Error('알 수 없는 함수: ' + String(name));
            return API[name].apply(null, args);
          })
          .then(function(v){ if (onOk) onOk(v); })
          .catch(function(e){
            console.error(e);
            if (onFail) onFail(e); else toast(e.message || '오류가 발생했습니다.', 'err');
          });
      };
    }
  });
  return runner;
}
const google = { script: { get run(){ return makeRunner(); } } };

let appStarted = false;
function showLoginError(msg){
  document.getElementById('loginErr').textContent = msg || '';
}
async function afterLogin(){
  let allowed = false;
  try { allowed = must(await sb.rpc('is_allowed_user')); } catch (e) { allowed = false; }
  if (!allowed){
    await sb.auth.signOut();
    document.getElementById('loginBack').classList.remove('hidden');
    showLoginError('이 계정은 접근 권한이 없습니다.');
    return;
  }
  document.getElementById('loginBack').classList.add('hidden');
  document.getElementById('logoutBtn').style.display = '';
  if (!appStarted){ appStarted = true; startApp(); }
}
async function doLogin(ev){
  ev.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; showLoginError('');
  const res = await sb.auth.signInWithPassword({
    email: document.getElementById('loginEmail').value.trim(),
    password: document.getElementById('loginPw').value
  });
  btn.disabled = false;
  if (res.error){ showLoginError('이메일 또는 비밀번호가 올바르지 않습니다.'); return; }
  afterLogin();
}
async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}

  const res = await sb.auth.getSession();
  if (res.data && res.data.session) afterLogin();

/* =========================================================
★ 방학 D-day 설정
→ 아래 두 값만 수정하세요.
· VACATION_DATE : 방학 시작일 (yyyy-MM-dd)
· VACATION_LABEL: 뱃지에 표시할 이름
========================================================= */
const VACATION_DATE = '2027-01-08';
const VACATION_LABEL = '겨울방학까지';

let state = {
view: 'day',
date: '',
today: '',
schools: [],
currentRecords: [],
editingRow: null
};

/* [성능] 뷰별 응답 캐시 (같은 날짜를 다시 볼 때 서버 왕복 생략)
   - key: 'day|2026-01-01', 'week|2026-01-01', 'cal|2026-1', 'hol'
   - 저장/수정/삭제 시 clearViewCache()로 통째로 비움 */
let viewCache = {};
function clearViewCache(){ viewCache = {}; }

/* 공통 유틸 */
function toast(msg, type){
const el = document.getElementById('toast');
el.className = 'toast show ' + (type||'');
el.textContent = msg;
setTimeout(function(){ el.className='toast '+(type||''); }, 1800);
}
function fmt(d){ return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function parseD(s){ return new Date(s + 'T00:00:00'); }
function dowLabel(d){ return ['일','월','화','수','목','금','토'][d.getDay()]; }
function prettyDay(s){
const d = parseD(s);
return ('0'+(d.getMonth()+1)).slice(-2) + '월 ' + ('0'+d.getDate()).slice(-2) + '일 (' + dowLabel(d) + ')';
}
function prettyLong(s){
const d = parseD(s);
return d.getFullYear() + '년 ' + ('0'+(d.getMonth()+1)).slice(-2) + '월 ' + ('0'+d.getDate()).slice(-2) + '일 (' + dowLabel(d) + ')';
}
function weekRangeMonFri(s){
const d = parseD(s); const dow = d.getDay();
const diffToMon = (dow === 0) ? -6 : (1 - dow);
const mon = new Date(d); mon.setDate(d.getDate() + diffToMon);
const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
return { start: fmt(mon), end: fmt(fri) };
}
function monthRange(s){
const d = parseD(s);
const start = new Date(d.getFullYear(), d.getMonth(), 1);
const end = new Date(d.getFullYear(), d.getMonth()+1, 0);
return { start: fmt(start), end: fmt(end) };
}
function daysBetween(a, b){
return Math.round((parseD(a).getTime() - parseD(b).getTime()) / (24*3600*1000));
}
function hashHue(s){
s = String(s||''); let h = 0;
for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
return h % 360;
}
function schoolStyle(name){
const h = hashHue(name);
return 'background:hsl('+h+',75%,92%);color:hsl('+h+',55%,28%);border-color:hsl('+h+',60%,80%);';
}
function chip(name){
if(!name) return '';
return '<span class="school-chip" style="'+schoolStyle(name)+'">'+esc(name)+'</span>';
}
function esc(s){
return String(s==null?'':s).replace(/[&<>"']/g, function(c){
return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
});
}
/* [신규] 로딩 표시 */
function showLoading(msg){
document.getElementById('viewerBody').innerHTML =
'<div class="skeleton"><span class="spinner"></span>'+esc(msg||'불러오는 중...')+'</div>';
}

/* D-day */
function updateDday(todayStr){
const el = document.getElementById('ddayBadge');
if (!VACATION_DATE) { el.textContent = ''; return; }
const diff = daysBetween(VACATION_DATE, todayStr);
let txt;
if (diff > 0) txt = VACATION_LABEL + '까지 <b>D-' + diff + '</b>';
else if (diff === 0) txt = VACATION_LABEL + ' <b>D-DAY</b>';
else txt = VACATION_LABEL + ' <b>D+' + (-diff) + '</b>';
el.innerHTML = txt;
}

}

/* =========================================================
   초기화 : 로그인 후 getInitialData() 1회 호출로 오늘 화면까지 완성
   (기존: getToday → getSchools → getRecords → getTodos 4회 왕복)
========================================================= */
/* 로그인 성공 후 1회 실행 */
function startApp(){
showLoading('초기 데이터를 불러오는 중...');

google.script.run.withSuccessHandler(function(init){
const today = init.today;
state.today = today; state.date = today;
state.schools = init.schools || [];

document.getElementById('todayBadge').textContent = '오늘: ' + prettyLong(today);
updateDday(today);
document.getElementById('inDate').value = today;
const wr = weekRangeMonFri(today);
document.getElementById('ttStart').value = wr.start;
document.getElementById('ttEnd').value = fmt(new Date(new Date(wr.end).getTime() + 7*24*3600*1000));
document.getElementById('statStart').value = monthRange(today).start;
document.getElementById('statEnd').value = monthRange(today).end;
document.getElementById('holStart').value = today;
document.getElementById('holEnd').value = today;

applySchools();

// 오늘 일(day) 화면 즉시 렌더 (추가 서버 호출 없음)
viewCache['day|' + today] = init.day;
state.currentRecords = init.day.records || [];
document.getElementById('centerTitle').textContent = prettyDay(today);
renderDayGrid(init.day);

// 오늘 할 일도 함께 받은 걸로 렌더
renderTodos(init.todos || []);
}).withFailureHandler(function(err){
document.getElementById('viewerBody').innerHTML =
'<div class="empty"><div class="big">불러오기 실패</div><div>'+esc(err.message)+'</div></div>';
}).getInitialData();

document.querySelectorAll('.tab').forEach(function(t){
t.addEventListener('click', function(){
document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
t.classList.add('active');
state.view = t.dataset.view;
updateVisibility();
reload();
});
});
addTtItem();
}

function updateVisibility(){
const v = state.view;
document.getElementById('viewerCard').style.display = (['day','week','cal'].indexOf(v)>=0) ? '' : 'none';
document.getElementById('ttCard').style.display = (v==='tt') ? '' : 'none';
document.getElementById('statCard').style.display = (v==='stat')? '' : 'none';
document.getElementById('addCard').style.display = (v==='add') ? '' : 'none';
document.getElementById('holCard').style.display = (v==='hol') ? '' : 'none';
// Todo는 일 뷰에서만
document.getElementById('todoCard').style.display = (v==='day') ? '' : 'none';
}

/* 학교 목록만 다시 필요할 때 (거의 안 씀 - getInitialData/조회 응답에 포함됨) */
function loadSchools(cb){
google.script.run.withSuccessHandler(function(list){
state.schools = list || [];
applySchools();
if (cb) cb();
}).getSchools();
}

/* 조회 응답에 담겨온 schools로 state 갱신 (서버 재호출 없이) */
function syncSchoolsFrom(res){
if (res && res.schools) {
state.schools = res.schools;
applySchools();
}
}

function moveDate(size, dir){
const d = parseD(state.date);
const v = state.view;
if (v==='day'){
d.setDate(d.getDate() + (size==='big' ? 7*dir : 1*dir));
} else if (v==='week'){
d.setDate(d.getDate() + (size==='big' ? 28*dir : 7*dir));
} else if (v==='cal'){
if (size==='big') d.setFullYear(d.getFullYear()+dir);
else d.setMonth(d.getMonth()+dir);
}
state.date = fmt(d);
reload();
}

function reload(){
const v = state.view;
if (v==='day') { loadDay(); loadTodos(); }
else if (v==='week') loadWeek();
else if (v==='cal') loadCalendar();
else if (v==='hol') loadHolidays();
}

/* ============== 일 뷰 (그리드) ============== */
function loadDay(){
document.getElementById('centerTitle').textContent = prettyDay(state.date);
const key = 'day|' + state.date;
if (viewCache[key]) { // 캐시 히트 → 즉시 렌더
state.currentRecords = viewCache[key].records || [];
renderDayGrid(viewCache[key]);
return;
}
showLoading();
google.script.run.withSuccessHandler(function(res){
viewCache[key] = res;
state.currentRecords = res.records || [];
syncSchoolsFrom(res);
renderDayGrid(res);
}).withFailureHandler(function(err){ toast(err.message,'err'); }).getRecords(state.date, '');
}

function renderDayGrid(res){
const box = document.getElementById('viewerBody');
const records = res.records || [];
const hol = res.holiday;

const map = {}; // period -> [records]
const outOfGrid = [];
records.forEach(function(r){
const p = parseInt(r.period, 10);
if (!p || p < 1 || p > 7) { outOfGrid.push(r); return; }
(map[p] = map[p] || []).push(r);
});

const periods = [1,2,3,4,5,6,7];
const d = parseD(state.date);
const isToday = (state.date === state.today);
const headCls = hol ? 'holiday' : (isToday ? 'today' : '');

let html = '<div class="week-grid day">';
html += '<div class="wg-corner">교시</div>';
html += '<div class="wg-head '+headCls+'">' +
'<div class="wg-dow">'+dowLabel(d)+'요일</div>' +
'<div class="wg-date">('+d.getDate()+'일)</div>' +
'</div>';

periods.forEach(function(p){
html += '<div class="wg-period">'+p+'교시</div>';
if (hol){
html += '<div class="wg-cell hol">'+esc(hol.reason || '휴일')+'</div>';
return;
}
const items = map[p] || [];
let cell = '<div class="wg-cell">';
items.forEach(function(r){
cell += '<div class="wg-item" style="'+schoolStyle(r.school)+'" onclick="openProgModal('+r.row+')">' +
'<div class="wg-cls">'+esc(r.cls || '(반없음)')+'</div>' +
'<div class="wg-school">'+esc(r.school || '')+'</div>' +
'</div>';
});
cell += '</div>';
html += cell;
});
html += '</div>';

if (outOfGrid.length){
html += '<h3 style="margin-top:12px">교시 지정 없음 · 그 외 (' + outOfGrid.length + '건)</h3>' +
buildTable(outOfGrid, false);
}
box.innerHTML = html;
}

/* ============== 주 뷰 ============== */
function loadWeek(){
const range = weekRangeMonFri(state.date);
const s = parseD(range.start), e = parseD(range.end);
document.getElementById('centerTitle').textContent =
('0'+(s.getMonth()+1)).slice(-2) + '/' + ('0'+s.getDate()).slice(-2) + ' ~ ' +
('0'+(e.getMonth()+1)).slice(-2) + '/' + ('0'+e.getDate()).slice(-2);

const key = 'week|' + range.start;
if (viewCache[key]) {
state.currentRecords = viewCache[key].records || [];
renderWeek(viewCache[key], range);
return;
}
showLoading();
google.script.run.withSuccessHandler(function(res){
viewCache[key] = res;
state.currentRecords = res.records || [];
syncSchoolsFrom(res);
renderWeek(res, range);
}).withFailureHandler(function(err){ toast(err.message,'err'); }).getRecordsRange(range.start, range.end, '');
}

function renderWeek(res, range){
const box = document.getElementById('viewerBody');
const monday = parseD(range.start);
const days = [];
for (let i=0;i<5;i++){
const d = new Date(monday); d.setDate(monday.getDate()+i);
days.push({ date: fmt(d), label: dowLabel(d), dayNum: d.getDate() });
}
const holidays = res.holidays || [];
function findHol(ds){
for (let i=0;i<holidays.length;i++){
const h = holidays[i];
if (ds >= String(h.start) && ds <= String(h.end || h.start)) return h;
}
return null;
}
const map = {};
(res.records || []).forEach(function(r){
const p = parseInt(r.period, 10);
if (!p || p < 1 || p > 7) return;
(map[r.date + '|' + p] = map[r.date + '|' + p] || []).push(r);
});
const periods = [1,2,3,4,5,6,7];
let html = '<div class="week-grid week">';
html += '<div class="wg-corner">교시</div>';
days.forEach(function(day){
const hol = findHol(day.date);
const cls = (day.date === state.today) ? 'today' : (hol ? 'holiday' : '');
html += '<div class="wg-head '+cls+'">' +
'<div class="wg-dow">'+day.label+'</div>' +
'<div class="wg-date">('+day.dayNum+'일)</div>' +
'</div>';
});
periods.forEach(function(p){
html += '<div class="wg-period">'+p+'교시</div>';
days.forEach(function(day){
const hol = findHol(day.date);
if (hol){
html += '<div class="wg-cell hol">'+esc(hol.reason || '휴일')+'</div>';
return;
}
const items = map[day.date + '|' + p] || [];
let cell = '<div class="wg-cell">';
items.forEach(function(r){
cell += '<div class="wg-item" style="'+schoolStyle(r.school)+'" onclick="openProgModal('+r.row+')">' +
'<div class="wg-cls">'+esc(r.cls || '(반없음)')+'</div>' +
'<div class="wg-school">'+esc(r.school || '')+'</div>' +
'</div>';
});
cell += '</div>';
html += cell;
});
});
html += '</div>';

const outOfGrid = (res.records || []).filter(function(r){
const p = parseInt(r.period, 10);
return !p || p < 1 || p > 7;
});
if (outOfGrid.length){
html += '<h3 style="margin-top:12px">교시 지정 없음 · 그 외 (' + outOfGrid.length + '건)</h3>' +
buildTable(outOfGrid, true);
}
box.innerHTML = html;
}

/* ============== 캘린더 뷰 ============== */
function loadCalendar(){
const d = parseD(state.date);
const y = d.getFullYear(), m = d.getMonth()+1;
document.getElementById('centerTitle').textContent = y + '.' + ('0'+m).slice(-2);

const key = 'cal|' + y + '-' + m;
if (viewCache[key]) { renderCalendar(viewCache[key]); return; }
showLoading();
google.script.run.withSuccessHandler(function(res){
viewCache[key] = res;
syncSchoolsFrom(res);
renderCalendar(res);
}).withFailureHandler(function(err){ toast(err.message,'err'); }).getMonthSummary(y, m, '');
}

function renderCalendar(res){
const box = document.getElementById('viewerBody');
const y = res.year, m = res.month;
const first = new Date(y, m-1, 1);
const startDow = first.getDay();
const startDate = new Date(y, m-1, 1 - startDow);
const holidays = res.holidays || [];
function findHol(ds){
for (let i=0;i<holidays.length;i++){
const h = holidays[i];
if (ds >= String(h.start) && ds <= String(h.end || h.start)) return h;
}
return null;
}
const cells = [];
for (let i=0;i<42;i++){
const dt = new Date(startDate); dt.setDate(startDate.getDate()+i);
const ds = fmt(dt);
const inMonth = (dt.getMonth() === m-1);
const info = res.summary[ds];
const dow = dt.getDay();
const hol = findHol(ds);
let chips = '';
if (info) {
const shown = info.schools.slice(0,3);
chips = shown.map(function(s){ return chip(s); }).join('');
if (info.schools.length > 3) chips += '<div class="more">+'+(info.schools.length-3)+'</div>';
}
const clsList = [ 'cell' ];
if (!inMonth) clsList.push('out');
if (ds === state.today) clsList.push('today');
if (hol) clsList.push('holiday');
cells.push(
'<div class="'+clsList.join(' ')+'" onclick="drillDown(\''+ds+'\')">' +
'<div class="d '+(dow===0?'sun':dow===6?'sat':'')+'">'+dt.getDate()+'</div>' +
(hol ? '<div class="hol-tag">'+esc(hol.reason||'휴일')+'</div>'
: (info ? '<div class="cnt">'+info.count+'</div>' : '')) +
'<div class="chips">'+chips+'</div>' +
'</div>'
);
}
const dowH = ['일','월','화','수','목','금','토'].map(function(n,i){
return '<div class="dow '+(i===0?'sun':i===6?'sat':'')+'">'+n+'</div>';
}).join('');
box.innerHTML =
'<div class="cal">' + dowH + cells.join('') + '</div>' +
'<div id="drillBox" style="margin-top:14px"></div>';
}

function drillDown(ds){
const key = 'day|' + ds; // 일 뷰 캐시와 공유
function paint(res){
state.currentRecords = res.records || [];
const el = document.getElementById('drillBox');
let banner = '';
if (res.holiday){
banner = '<div style="margin:8px 0"><span class="badge danger">휴일</span> ' + esc(res.holiday.reason||'') + '</div>';
}
if (!res.records.length){
el.innerHTML = '<h3>'+prettyLong(ds)+'</h3>' + banner + '<div class="empty"><div class="big">자료가 없습니다</div></div>';
} else {
el.innerHTML = '<h3>'+prettyLong(ds)+' <span class="badge">'+res.records.length+'건</span></h3>' +
banner + buildTable(res.records, false);
}
}
if (viewCache[key]) { paint(viewCache[key]); return; }
google.script.run.withSuccessHandler(function(res){
viewCache[key] = res;
syncSchoolsFrom(res);
paint(res);
}).withFailureHandler(function(err){ toast(err.message,'err'); }).getRecords(ds, '');
}

/* ============== 테이블 빌더 (그리드 외 항목/캘린더 드릴다운용) ============== */
function buildTable(records, includeDate){
let head = '<table><thead><tr>';
if (includeDate) head += '<th>날짜</th>';
head += '<th>학교명</th><th class="num">교시</th><th>반</th><th>진도</th>' +
'<th style="width:130px">동작</th></tr></thead><tbody>';
const body = records.map(function(r){
return '<tr>' +
(includeDate ? '<td>'+esc(r.date)+'</td>' : '') +
'<td>' + chip(r.school) + '</td>' +
'<td class="num">' + esc(r.period) + '</td>' +
'<td>' + esc(r.cls) + '</td>' +
'<td>' + esc(r.progress) + '</td>' +
'<td>' +
'<button class="btn warn sm" onclick="openEditModal('+r.row+')">수정</button> ' +
'<button class="btn danger sm" onclick="removeRow('+r.row+')">삭제</button>' +
'</td>' +
'</tr>';
}).join('');
return head + body + '</tbody></table>';
}

function removeRow(row){
if (!confirm('이 행을 삭제하시겠습니까?')) return;
google.script.run.withSuccessHandler(function(){
toast('삭제되었습니다.', 'ok');
closeProgModal();
clearViewCache(); // 데이터 바뀜 → 뷰 캐시 무효화
reload();
}).withFailureHandler(function(err){ toast(err.message,'err'); }).deleteRecord(row);
}

/* ============== 진도 상세 모달 ============== */
function findRecordByRow(row){
for (let i=0;i<state.currentRecords.length;i++){
if (state.currentRecords[i].row === row) return state.currentRecords[i];
}
return null;
}
function openProgModal(row){
const r = findRecordByRow(row);
if (!r){ toast('자료를 찾지 못했습니다.','err'); return; }
document.getElementById('pmTitle').innerHTML =
esc(r.school) + ' · ' + esc(r.cls || '') + ' · ' + esc(r.period || '') + '교시';
document.getElementById('pmMeta').textContent = prettyLong(r.date);
document.getElementById('pmProg').textContent = r.progress || '(진도 내용 없음)';
document.getElementById('pmEditBtn').onclick = function(){
closeProgModal();
openEditModal(row);
};
document.getElementById('pmDelBtn').onclick = function(){
removeRow(row);
};
document.getElementById('progModal').classList.add('show');
}
function closeProgModal(){
document.getElementById('progModal').classList.remove('show');
}

/* 수정 모달 */
function openEditModal(row){
const r = findRecordByRow(row);
if (!r){ toast('자료를 찾지 못했습니다.','err'); return; }
state.editingRow = row;
document.getElementById('edDate').value = r.date;
document.getElementById('edSchool').value = r.school || '';
document.getElementById('edPeriod').value = r.period || '';
document.getElementById('edClass').value = r.cls || '';
document.getElementById('edProgress').value= r.progress || '';
document.getElementById('editModal').classList.add('show');
}
function closeEditModal(){
state.editingRow = null;
document.getElementById('editModal').classList.remove('show');
}
function saveEdit(){
const row = state.editingRow;
if (!row){ closeEditModal(); return; }
const rec = {
date: document.getElementById('edDate').value,
school: document.getElementById('edSchool').value.trim(),
period: document.getElementById('edPeriod').value.trim(),
cls: document.getElementById('edClass').value.trim(),
progress:document.getElementById('edProgress').value.trim()
};
if (!rec.date) { toast('날짜를 입력하세요','err'); return; }
if (!rec.school) { toast('학교명을 입력하세요','err'); return; }
google.script.run
.withSuccessHandler(function(){
toast('수정되었습니다.', 'ok');
closeEditModal();
clearViewCache();
reload();
})
.withFailureHandler(function(err){ toast(err.message,'err'); })
.updateRecord(row, rec);
}

/* ============== Todo List ============== */
function loadTodos(){
google.script.run.withSuccessHandler(renderTodos).getTodos();
}
function renderTodos(list){
list = list || [];
document.getElementById('todoCount').textContent = list.length;
const box = document.getElementById('todoList');
if (!list.length){
box.innerHTML = '<div class="empty" style="padding:14px"><div>진행 중인 할 일이 없습니다.</div></div>';

}
box.innerHTML = list.map(function(t){
return '<div class="todo-item">' +
'<input type="checkbox" onchange="completeTodo('+t.row+')" title="완료"/>' +

'<div class="todo-time">'+esc(t.createdAt)+'</div>' +

'</div>';

function submitTodo(){
const el = document.getElementById('todoText');
const t = el.value.trim();
if (!t){ toast('내용을 입력하세요','err'); return; }

.withSuccessHandler(function(list){

renderTodos(list);
})
.withFailureHandler(function(err){ toast(err.message,'err'); })
.addTodo(t);

function completeTodo(row){
google.script.run
.withSuccessHandler(function(list){
toast('완료 처리', 'ok');
renderTodos(list);
})
.withFailureHandler(function(err){ toast(err.message,'err'); })
.completeTodo(row);

function deleteTodo(row){
if (!confirm('이 할 일을 삭제하시겠습니까?')) return;
google.script.run
.withSuccessHandler(function(list){
toast('삭제되었습니다.', 'ok');
renderTodos(list);
})
.withFailureHandler(function(err){ toast(err.message,'err'); })
.deleteTodo(row);
}

/* ============== 기초 시간표 ============== */
function addTtItem(){
const wrap = document.getElementById('ttItems');
const div = document.createElement('div');
div.className = 'tt-item';
div.innerHTML =
'<label class="field">요일<select class="tt-dow">' +
['일','월','화','수','목','금','토'].map(function(n,i){
return '<option value="'+i+'" '+(i===1?'selected':'')+'>'+n+'</option>';
}).join('') +
'</select></label>' +
'<label class="field">교시<input type="text" class="tt-period" placeholder="예: 3"/></label>' +

function generateTt(){
const school = document.getElementById('ttSchool').value.trim();
const start = document.getElementById('ttStart').value;
const end = document.getElementById('ttEnd').value;
const overwrite = document.getElementById('ttOverwrite').value === 'force';
const skipHolidays = document.getElementById('ttSkipHol').value === 'yes';
if (!school){ toast('학교명을 입력하세요','err'); return; }
if (!start || !end){ toast('기간을 입력하세요','err'); return; }
const items = [];
document.querySelectorAll('#ttItems .tt-item').forEach(function(el){
const dow = parseInt(el.querySelector('.tt-dow').value,10);
const period = el.querySelector('.tt-period').value.trim();
const cls = el.querySelector('.tt-cls').value.trim();
const prog = el.querySelector('.tt-prog').value.trim();
if (period || cls || prog) items.push({dow:dow, period:period, cls:cls, progress:prog});
});
if (!items.length){ toast('요일별 시간표를 추가하세요','err'); return; }
const spec = { school:school, start:start, end:end, items:items, overwrite:overwrite, skipHolidays:skipHolidays };
google.script.run
.withSuccessHandler(function(res){
toast(res.message, res.inserted>0 ? 'ok' : '');
clearViewCache(); // 대량 추가됨 → 뷰 캐시 무효화
loadSchools();
})
.withFailureHandler(function(err){ toast(err.message,'err'); })
.generateTimetable(spec);
}

/* ============== 자료 입력 ============== */
function submitRecord(){
const rec = {
date: document.getElementById('inDate').value,
school: document.getElementById('inSchool').value.trim(),
period: document.getElementById('inPeriod').value.trim(),
cls: document.getElementById('inClass').value.trim(),
progress:document.getElementById('inProgress').value.trim()
};

if (!rec.school) { toast('학교명을 입력하세요','err'); return; }
google.script.run
.withSuccessHandler(function(res){
toast('저장되었습니다.', 'ok');
clearForm();
clearViewCache(); // 데이터 추가됨 → 뷰 캐시 무효화
syncSchoolsFrom(res); // 새 학교면 응답에 이미 반영되어 옴

/* ============== 공휴일 관리 ============== */
function loadHolidays(){
const key = 'hol';
if (viewCache[key]) { renderHolidays(viewCache[key]); return; }
google.script.run.withSuccessHandler(function(list){
viewCache[key] = list || [];
renderHolidays(list || []);
}).getHolidays();
}
function renderHolidays(list){
const box = document.getElementById('holList');
if (!list.length){
box.innerHTML = '<div class="empty"><div class="big">등록된 휴일이 없습니다</div><div>위 폼에서 방학·공휴일을 등록하세요.</div></div>';
return;
}
let html = '<table><thead><tr><th>시작일</th><th>종료일</th><th>사유</th><th style="width:80px">동작</th></tr></thead><tbody>';
list.forEach(function(h){
html += '<tr>' +
'<td>'+esc(h.start)+'</td><td>'+esc(h.end)+'</td><td>'+esc(h.reason||'')+'</td>' +
'<td><button class="btn danger sm" onclick="removeHoliday('+h.row+')">삭제</button></td>' +
'</tr>';
});
html += '</tbody></table>';
box.innerHTML = html;
}
function submitHoliday(){
const h = {
start: document.getElementById('holStart').value,
end: document.getElementById('holEnd').value,
reason: document.getElementById('holReason').value.trim()
};
if (!h.start){ toast('시작일을 입력하세요','err'); return; }
if (!h.end) h.end = h.start;
google.script.run
.withSuccessHandler(function(list){
toast('휴일 등록 완료', 'ok');
document.getElementById('holReason').value = '';
clearViewCache(); // 휴일 바뀌면 일/주/캘린더 표시도 달라짐
viewCache['hol'] = list || [];
renderHolidays(list || []);
})
.withFailureHandler(function(err){ toast(err.message,'err'); })
.addHoliday(h);
}
function removeHoliday(row){
if (!confirm('이 휴일을 삭제하시겠습니까?')) return;
google.script.run
.withSuccessHandler(function(list){
toast('삭제되었습니다.', 'ok');
clearViewCache();
viewCache['hol'] = list || [];
renderHolidays(list || []);
})
.withFailureHandler(function(err){ toast(err.message,'err'); })
.deleteHoliday(row);
}

/* ============== 수업시수 집계 ============== */
function runStats(){
const c = {
start: document.getElementById('statStart').value,
end: document.getElementById('statEnd').value,
school: document.getElementById('statSchool').value,
groupBy:document.getElementById('statGroup').value
};
if (!c.start || !c.end){ toast('기간을 입력하세요','err'); return; }
document.getElementById('statBody').innerHTML =
'<div class="skeleton"><span class="spinner"></span>집계 중...</div>';
google.script.run
.withSuccessHandler(function(res){ renderStats(res, c.groupBy); })
.withFailureHandler(function(err){ toast(err.message,'err'); })
.getClassStats(c);
}
function renderStats(res, groupBy){
const box = document.getElementById('statBody');
if (!res.groups.length){
box.innerHTML = '<div class="empty"><div class="big">집계 결과 없음</div></div>';
return;
}
const uniqSchools = {};
res.groups.forEach(function(g){ uniqSchools[g.school]=true; });
let kpis =
'<div class="kpi-row">' +
'<div class="kpi p"><div class="label">총 수업시수</div><div class="value">'+res.total+' 회</div></div>' +
'<div class="kpi o"><div class="label">학교 수</div><div class="value">'+Object.keys(uniqSchools).length+' 개</div></div>' +
'<div class="kpi w"><div class="label">집계 기간</div><div class="value" style="font-size:15px">'+res.start+' ~ '+res.end+'</div></div>' +
'</div>';
const max = Math.max.apply(null, res.groups.map(function(g){ return g.count; }));
let head = '<table><thead><tr><th>학교</th>';
if (groupBy==='school-class') head += '<th>반</th>';
if (groupBy==='school-day') head += '<th>요일</th>';
head += '<th class="num">수업 횟수</th><th style="width:40%">비중</th></tr></thead><tbody>';
const body = res.groups.map(function(g){
const pct = Math.round(g.count/max*100);
return '<tr>' +
'<td>' + chip(g.school) + '</td>' +
(groupBy==='school-class' ? '<td>' + esc(g.cls||'-') + '</td>' : '') +
(groupBy==='school-day' ? '<td>' + esc(g.day||'-') + '요일</td>' : '') +
'<td class="num"><b>'+g.count+'</b> 회</td>' +
'<td><div style="background:#eef2ff; border-radius:6px; overflow:hidden; height:10px"><div style="width:'+pct+'%; height:100%; background:linear-gradient(90deg,#4f46e5,#7c3aed)"></div></div></td>' +
'</tr>';
}).join('');
box.innerHTML = kpis + head + body + '</tbody></table>';
}
</script>
